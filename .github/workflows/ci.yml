name: Verify incident
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis -- --locked
      - name: Smoke-test the Windows installer and app process
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/NS' -PassThru
          if (-not $setup.WaitForExit(120000)) { Stop-Process -Id $setup.Id -Force; throw "Installer timed out" }
          if ($setup.ExitCode -ne 0) { throw "Installer returned $($setup.ExitCode)" }
          $installDir = Join-Path $env:LOCALAPPDATA 'IT Learning Lab'
          $appExe = Get-ChildItem $installDir -Filter 'it-learning-lab.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $appExe) { throw "Installed executable not found in $installDir" }
          $notices = Get-ChildItem $installDir -Filter 'RUST-DEPENDENCIES.txt' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $notices) { throw "Installed Rust notices not found" }
          $app = Start-Process -FilePath $appExe.FullName -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) { throw "Application exited immediately with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-experimental
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
