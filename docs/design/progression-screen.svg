<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">IT Learning Lab career progression screen concept</title>
  <desc id="desc">A static example shows one guided printer incident completed, 100 total experience points, two skills with guided practice evidence, a first resolution achievement, and an independent replay suggestion. Mastery remains unverified.</desc>
  <defs>
    <linearGradient id="career" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f1e8"/><stop offset="1" stop-color="#dce9df"/></linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1b372a" flood-opacity=".04"/></filter>
  </defs>
  <rect width="1440" height="980" fill="#f4f5ef"/>
  <rect width="1440" height="72" fill="#ffffff"/>
  <path d="M0 72H1440" stroke="#dce5da"/>
  <rect x="30" y="20" width="32" height="32" rx="8" fill="#285c47"/>
  <text x="46" y="41" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="700">IT</text>
  <text x="76" y="42" fill="#1e3329" font-family="Arial,sans-serif" font-size="15" font-weight="700">IT Learning Lab</text>
  <text x="1284" y="42" fill="#435f4f" font-family="Arial,sans-serif" font-size="12" font-weight="600">●  Local practice</text>
  <rect x="0" y="73" width="220" height="907" fill="#f9faf6"/>
  <path d="M220 73V980" stroke="#dfe7de"/>
  <text x="30" y="117" fill="#536b5c" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">YOUR WORKSPACE</text>
  <text x="30" y="157" fill="#63766a" font-family="Arial,sans-serif" font-size="13">◦</text><text x="56" y="157" fill="#536b5c" font-family="Arial,sans-serif" font-size="13" font-weight="600">Incident inbox</text>
  <rect x="16" y="175" width="188" height="42" rx="7" fill="#e3eee3"/>
  <text x="30" y="201" fill="#285c47" font-family="Arial,sans-serif" font-size="13">◉</text><text x="56" y="201" fill="#214e38" font-family="Arial,sans-serif" font-size="13" font-weight="700">Career progress</text>
  <text x="30" y="248" fill="#63766a" font-family="Arial,sans-serif" font-size="13">◦</text><text x="56" y="248" fill="#536b5c" font-family="Arial,sans-serif" font-size="13" font-weight="600">Practice</text>
  <path d="M30 293H190" stroke="#e0e8de"/>
  <text x="30" y="328" fill="#536b5c" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">CURRENT PATH</text>
  <text x="30" y="353" fill="#263f32" font-family="Arial,sans-serif" font-size="13" font-weight="700">Help desk →</text>
  <text x="30" y="374" fill="#263f32" font-family="Arial,sans-serif" font-size="13" font-weight="700">Network support</text>
  <text x="30" y="900" fill="#536b5c" font-family="Arial,sans-serif" font-size="11">Offline · no account</text>
  <text x="260" y="116" fill="#52695d" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">CAREER PROGRESS  /  OVERVIEW</text>
  <text x="260" y="158" fill="#1d342a" font-family="Georgia,serif" font-size="35">Your work is building skills.</text>
  <text x="261" y="184" fill="#536b5d" font-family="Arial,sans-serif" font-size="14">Every resolved incident leaves a record of what you practiced.</text>
  <!-- Path summary -->
  <rect x="260" y="215" width="750" height="194" rx="14" fill="url(#career)" stroke="#cfdfd0" filter="url(#shadow)"/>
  <text x="292" y="251" fill="#3c6b4d" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">CURRENT CAREER PATH</text>
  <text x="292" y="286" fill="#1f3b2b" font-family="Georgia,serif" font-size="27">Help desk to network support</text>
  <text x="292" y="311" fill="#486654" font-family="Arial,sans-serif" font-size="13">Build from troubleshooting toward confident network changes.</text>
  <text x="292" y="345" fill="#345744" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing=".7">INC-1001 · CASE STAGES</text>
  <text x="976" y="345" text-anchor="end" fill="#345744" font-family="Arial,sans-serif" font-size="11" font-weight="700">1 / 1 incidents completed</text>
  <path d="M330 369H938" stroke="#4b8560" stroke-width="3"/>
  <circle cx="330" cy="369" r="7" fill="#4b8560"/><circle cx="634" cy="369" r="7" fill="#4b8560"/><circle cx="938" cy="369" r="7" fill="#4b8560"/>
  <text x="330" y="394" text-anchor="middle" fill="#345744" font-family="Arial,sans-serif" font-size="10" font-weight="700">TRIAGE</text>
  <text x="634" y="394" text-anchor="middle" fill="#345744" font-family="Arial,sans-serif" font-size="10" font-weight="700">HANDOFF</text>
  <text x="938" y="394" text-anchor="middle" fill="#345744" font-family="Arial,sans-serif" font-size="10" font-weight="700">VERIFIED REPAIR</text>
  <!-- Level card -->
  <rect x="1030" y="215" width="350" height="194" rx="14" fill="#fff" stroke="#dde7dd" filter="url(#shadow)"/>
  <rect x="1060" y="244" width="48" height="48" rx="13" fill="#e3efe4"/>
  <path d="M1084 253l3.3 6.6 7.3 1.1-5.3 5.2 1.3 7.3-6.6-3.5-6.6 3.5 1.3-7.3-5.3-5.2 7.3-1.1z" fill="#4f8060"/>
  <text x="1122" y="260" fill="#536b5d" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">LEARNER LEVEL</text>
  <text x="1122" y="289" fill="#203c2d" font-family="Georgia,serif" font-size="27">Level 2</text>
  <text x="1060" y="327" fill="#254635" font-family="Arial,sans-serif" font-size="14" font-weight="700">100 total XP</text>
  <text x="1060" y="351" fill="#536b5d" font-family="Arial,sans-serif" font-size="12">0 / 150 XP toward level 3</text>
  <rect x="1060" y="370" width="290" height="7" rx="3.5" fill="#e4ebe3"/>
  <text x="1060" y="397" fill="#536b5d" font-family="Arial,sans-serif" font-size="10">More incidents are planned for the future.</text>
  <!-- Main evidence -->
  <text x="260" y="451" fill="#536b5d" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">DEMONSTRATED IN THIS INCIDENT</text>
  <text x="260" y="480" fill="#20392c" font-family="Georgia,serif" font-size="23">Skills you practiced</text>
  <text x="260" y="504" fill="#536b5d" font-family="Arial,sans-serif" font-size="12">Evidence is specific to the incident and includes whether help was used.</text>
  <rect x="260" y="525" width="365" height="155" rx="12" fill="#fff" stroke="#dce6dc" filter="url(#shadow)"/>
  <rect x="281" y="546" width="33" height="33" rx="9" fill="#e7f1e7"/><path d="M290 563h15m-12-5h9m-9 10h9" stroke="#3c7653" stroke-width="2" stroke-linecap="round"/>
  <text x="328" y="560" fill="#203c2d" font-family="Arial,sans-serif" font-size="14" font-weight="700">Access-port VLANs</text>
  <text x="328" y="580" fill="#536b5d" font-family="Arial,sans-serif" font-size="12">Correct port configuration</text>
  <rect x="281" y="610" width="121" height="25" rx="5" fill="#eef4ea"/><text x="293" y="627" fill="#356649" font-family="Arial,sans-serif" font-size="11" font-weight="700">Guided practice</text>
  <text x="281" y="657" fill="#536b5d" font-family="Arial,sans-serif" font-size="11">Evidence from INC-1001</text>
  <rect x="645" y="525" width="365" height="155" rx="12" fill="#fff" stroke="#dce6dc" filter="url(#shadow)"/>
  <rect x="666" y="546" width="33" height="33" rx="9" fill="#e7f1e7"/><path d="M674 563l5 5 10-11" fill="none" stroke="#3c7653" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="713" y="560" fill="#203c2d" font-family="Arial,sans-serif" font-size="14" font-weight="700">Connectivity checks</text>
  <text x="713" y="580" fill="#536b5d" font-family="Arial,sans-serif" font-size="12">Verified after the change</text>
  <rect x="666" y="610" width="121" height="25" rx="5" fill="#eef4ea"/><text x="678" y="627" fill="#356649" font-family="Arial,sans-serif" font-size="11" font-weight="700">Guided practice</text>
  <text x="666" y="657" fill="#536b5d" font-family="Arial,sans-serif" font-size="11">Evidence from INC-1001</text>
  <!-- Achievements -->
  <rect x="1030" y="435" width="350" height="416" rx="14" fill="#fff" stroke="#dce6dc" filter="url(#shadow)"/>
  <text x="1058" y="468" fill="#536b5d" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">ACHIEVEMENTS</text>
  <text x="1058" y="498" fill="#20392c" font-family="Georgia,serif" font-size="22">Milestones earned</text>
  <circle cx="1079" cy="541" r="19" fill="#dfeee0"/><path d="M1071 541l5 5 10-11" fill="none" stroke="#356d4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1110" y="536" fill="#213c2d" font-family="Arial,sans-serif" font-size="13" font-weight="700">First resolution</text>
  <text x="1110" y="556" fill="#536b5d" font-family="Arial,sans-serif" font-size="11">Incident checklist completed</text>
  <path d="M1058 584H1352" stroke="#edf1eb"/>
  <circle cx="1079" cy="621" r="19" fill="#f1f4ee" stroke="#d2ddd1"/><circle cx="1079" cy="621" r="5" fill="none" stroke="#7a9081" stroke-width="1.5"/>
  <text x="1110" y="615" fill="#213c2d" font-family="Arial,sans-serif" font-size="13" font-weight="700">Independent completion</text>
  <text x="1110" y="635" fill="#536b5d" font-family="Arial,sans-serif" font-size="11">Not earned · unassisted attempt</text>
  <rect x="1058" y="675" width="294" height="132" rx="9" fill="#f5f7f1"/>
  <text x="1074" y="701" fill="#536b5d" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">INDEPENDENT MASTERY</text>
  <text x="1074" y="728" fill="#263f32" font-family="Arial,sans-serif" font-size="13" font-weight="700">Not yet verified</text>
  <text x="1074" y="749" fill="#536b5d" font-family="Arial,sans-serif" font-size="11">Requires more than one meaningfully</text>
  <text x="1074" y="767" fill="#536b5d" font-family="Arial,sans-serif" font-size="11">different independent assessment.</text>
  <!-- Suggested practice -->
  <rect x="260" y="708" width="750" height="143" rx="12" fill="#fff" stroke="#dce6dc" filter="url(#shadow)"/>
  <rect x="282" y="732" width="34" height="34" rx="9" fill="#f4ece1"/><path d="M291 749a8 8 0 1 0 3-6" fill="none" stroke="#97652f" stroke-width="2"/><path d="M291 739v5h5" fill="none" stroke="#97652f" stroke-width="2"/>
  <text x="332" y="742" fill="#536b5d" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">SUGGESTED PRACTICE</text>
  <text x="332" y="770" fill="#213c2d" font-family="Arial,sans-serif" font-size="15" font-weight="700">Try INC-1001 independently</text>
  <text x="332" y="793" fill="#536b5d" font-family="Arial,sans-serif" font-size="12">No hints or early feedback; replay earns no additional completion XP.</text>
  <rect x="332" y="811" width="132" height="25" rx="5" fill="#f0f5ed"/><text x="345" y="828" fill="#386448" font-family="Arial,sans-serif" font-size="11" font-weight="700">Unassisted replay</text>
  <path d="M260 898H1380" stroke="#dce5da"/>
  <text x="260" y="928" fill="#536b5d" font-family="Arial,sans-serif" font-size="11">DESIGN CONCEPT · EXAMPLE DATA · This screen is not implemented</text>
  <text x="1380" y="928" text-anchor="end" fill="#536b5d" font-family="Arial,sans-serif" font-size="11">XP shows activity. Skill evidence shows what you practiced.</text>
</svg>
